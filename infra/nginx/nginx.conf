# NGINX como balanceador de carga delante de los 3 ingestores.
# Reparte las peticiones en round robin (una a cada uno por turno).
# Si un ingestor falla 2 veces seguidas, se deja de usar 10 segundos y
# las peticiones se reintentan en otro: así la caída de uno no se nota.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # Formato de log que muestra a qué ingestor se envió cada petición
    log_format balanceo '$remote_addr "$request" $status -> $upstream_addr ($request_time s)';
    access_log /var/log/nginx/access.log balanceo;

    # Resolver interno de Docker: permite que NGINX arranque aunque falte un ingestor
    resolver 127.0.0.11 valid=10s;

    upstream ingestores {
        # zone + resolve: NGINX vuelve a preguntar la IP de cada ingestor
        # cuando su contenedor se reinicia (Docker puede darle otra IP)
        zone ingestores 64k;
        server ingestor-1:8000 max_fails=2 fail_timeout=10s resolve;
        server ingestor-2:8000 max_fails=2 fail_timeout=10s resolve;
        server ingestor-3:8000 max_fails=2 fail_timeout=10s resolve;
        keepalive 64;   # reutiliza conexiones hacia los ingestores
    }

    server {
        listen 80;
        client_max_body_size 5m;   # lotes de hasta 500 eventos

        location / {
            proxy_pass http://ingestores;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
            # Si un ingestor no responde, se prueba el siguiente (también en POST)
            proxy_next_upstream error timeout http_502 non_idempotent;
            proxy_next_upstream_tries 3;
            # Header para demostrar el balanceo: dirección del ingestor que atendió
            add_header X-Upstream $upstream_addr always;
        }
    }
}
